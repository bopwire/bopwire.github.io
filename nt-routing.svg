<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <style>.t{font-size:13.5px;font-weight:700}.s{fill:#5b6670;font-size:11px}.lbl{font-size:11px;font-weight:600}</style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15b07e"/></marker>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6670"/></marker>
  </defs>
  <g>
    <rect x="40" y="140" width="150" height="72" rx="12" fill="#fff" stroke="#cfd8dd" stroke-width="1.5"/>
    <text class="t" x="115" y="170" text-anchor="middle">📱 Player A</text><text class="s" x="115" y="190" text-anchor="middle">behind CGNAT</text>
  </g>
  <g>
    <rect x="315" y="40" width="170" height="66" rx="12" fill="#e7f7f0" stroke="#0a7d5a" stroke-width="1.5"/>
    <text class="t" x="400" y="68" text-anchor="middle" fill="#0a7d5a">🛰 Mini-node (VPS)</text><text class="s" x="400" y="88" text-anchor="middle">public IP · relay anchor</text>
  </g>
  <g>
    <rect x="590" y="140" width="150" height="72" rx="12" fill="#fff" stroke="#cfd8dd" stroke-width="1.5"/>
    <text class="t" x="665" y="170" text-anchor="middle">📱 Player B</text><text class="s" x="665" y="190" text-anchor="middle">seeding the song</text>
  </g>
  <g>
    <rect x="315" y="250" width="170" height="62" rx="12" fill="#e8f0f6" stroke="#3b7ea1" stroke-width="1.5"/>
    <text class="t" x="400" y="278" text-anchor="middle" fill="#295a74">⛓ Full node</text><text class="s" x="400" y="298" text-anchor="middle">firewalled → reached via relay</text>
  </g>

  <path d="M190,158 L590,158" stroke="#15b07e" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ag)" marker-start="url(#ag)"/>
  <text class="lbl" x="390" y="150" text-anchor="middle" fill="#0a7d5a">① direct connect (ICE / rats_connect)</text>

  <path d="M160,140 L360,106" stroke="#5b6670" stroke-width="1.6" marker-end="url(#a)"/>
  <text class="lbl" x="210" y="112" fill="#5b6670">② relay.forward</text>
  <path d="M440,106 L620,140" stroke="#5b6670" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M400,106 L400,250" stroke="#5b6670" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text class="lbl" x="470" y="185" fill="#5b6670">control → full node</text>

  <text class="s" x="390" y="330" text-anchor="middle">direct when NAT allows; the VPS relays only when it must</text>
</svg>
