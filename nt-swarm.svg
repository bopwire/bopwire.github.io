<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <style>.t{font-size:13px;font-weight:700}.s{fill:#5b6670;font-size:11px}.lbl{font-size:11px;font-weight:600}</style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15b07e"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b7ea1"/></marker>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6670"/></marker>
  </defs>
  <g>
    <rect x="30" y="150" width="150" height="72" rx="12" fill="#fff" stroke="#cfd8dd" stroke-width="1.5"/>
    <text class="t" x="105" y="180" text-anchor="middle">📱 Listener</text><text class="s" x="105" y="200" text-anchor="middle">wants song X</text>
  </g>
  <g>
    <rect x="300" y="40" width="170" height="64" rx="12" fill="#e8f0f6" stroke="#3b7ea1" stroke-width="1.5"/>
    <text class="t" x="385" y="66" text-anchor="middle" fill="#295a74">⛓ Full node</text><text class="s" x="385" y="84" text-anchor="middle">online holders + manifest</text>
  </g>
  <g>
    <rect x="300" y="250" width="170" height="62" rx="12" fill="#e7f7f0" stroke="#0a7d5a" stroke-width="1.5"/>
    <text class="t" x="385" y="278" text-anchor="middle" fill="#0a7d5a">🛰 Mini-node</text><text class="s" x="385" y="296" text-anchor="middle">relays chunks if no direct path</text>
  </g>
  <g fill="#fff" stroke="#cfd8dd" stroke-width="1.5">
    <rect x="600" y="60" width="165" height="52" rx="12"/><rect x="600" y="150" width="165" height="52" rx="12"/><rect x="600" y="240" width="165" height="52" rx="12"/>
  </g>
  <g text-anchor="middle"><text class="t" x="682" y="90">📱 Seeder 1</text><text class="t" x="682" y="180">💻 Seeder 2</text><text class="t" x="682" y="270">📱 DHT seeder</text></g>

  <path d="M180,165 L300,80" stroke="#5b6670" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text class="lbl" x="205" y="120" fill="#5b6670">stream.open(X)</text>
  <path d="M300,90 L185,172" stroke="#3b7ea1" stroke-width="1.6" marker-end="url(#ab)"/>
  <text class="lbl" x="300" y="150" fill="#3b7ea1">peers + piece manifest</text>

  <path d="M180,180 L600,90" stroke="#15b07e" stroke-width="1.8" marker-end="url(#ag)"/>
  <text class="lbl" x="360" y="120" fill="#0a7d5a">verified chunks (direct)</text>
  <path d="M180,190 L600,175" stroke="#15b07e" stroke-width="1.8" marker-end="url(#ag)"/>
  <path d="M180,205 L300,275" stroke="#5b6670" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <path d="M470,285 L600,270" stroke="#15b07e" stroke-width="1.8" marker-end="url(#ag)"/>
  <text class="lbl" x="500" y="305" fill="#0a7d5a">relayed chunks</text>

  <text class="s" x="400" y="345" text-anchor="middle">first byte = one piece fetch, not the whole file; every chunk is checked against the manifest on arrival</text>
</svg>
