<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <style>.t{font-size:13px;font-weight:700}.s{fill:#5b6670;font-size:11px}.chip{font-size:11px;font-weight:700}</style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15b07e"/></marker>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa6ad"/></marker>
  </defs>
  <g text-anchor="middle">
    <rect x="40" y="120" width="90" height="48" rx="10" fill="#f6f9f8" stroke="#cfd8dd" stroke-width="1.5"/><text class="t" x="85" y="149">#0</text>
    <rect x="160" y="120" width="90" height="48" rx="10" fill="#f6f9f8" stroke="#cfd8dd" stroke-width="1.5"/><text class="t" x="205" y="149">#1</text>
  </g>
  <path d="M130,144 L160,144" stroke="#9aa6ad" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M250,144 L300,92" stroke="#15b07e" stroke-width="1.8" marker-end="url(#ag)"/>
  <path d="M250,144 L300,214" stroke="#9aa6ad" stroke-width="1.6" marker-end="url(#a)"/>

  <g text-anchor="middle">
    <rect x="300" y="66" width="96" height="52" rx="10" fill="#e7f7f0" stroke="#0a7d5a" stroke-width="1.5"/><text class="t" x="348" y="88" fill="#0a7d5a">#2a</text><text class="s" x="348" y="106">w=180</text>
    <rect x="416" y="66" width="96" height="52" rx="10" fill="#e7f7f0" stroke="#0a7d5a" stroke-width="1.5"/><text class="t" x="464" y="88" fill="#0a7d5a">#3a</text><text class="s" x="464" y="106">w=260</text>
  </g>
  <path d="M396,92 L416,92" stroke="#15b07e" stroke-width="1.8" marker-end="url(#ag)"/>
  <rect x="530" y="78" width="210" height="28" rx="14" fill="none" stroke="#0a7d5a" stroke-width="1.3"/><text class="chip" x="635" y="96" text-anchor="middle" fill="#0a7d5a">weight 260 ✓ canonical</text>

  <g text-anchor="middle">
    <rect x="300" y="190" width="96" height="52" rx="10" fill="#fff" stroke="#cfd8dd" stroke-width="1.5" opacity=".85"/><text class="t" x="348" y="212" fill="#9aa6ad">#2b</text><text class="s" x="348" y="230">w=90</text>
  </g>
  <rect x="416" y="202" width="170" height="28" rx="14" fill="none" stroke="#9aa6ad" stroke-width="1.3"/><text class="chip" x="501" y="220" text-anchor="middle" fill="#9aa6ad">lighter → orphaned</text>

  <text class="s" x="390" y="278" text-anchor="middle">fork choice = cumulative audited-play weight (tip_weight); reorg_to_branch adopts the heavier branch</text>
</svg>
