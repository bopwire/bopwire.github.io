<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <style>.t{font-size:13px;font-weight:700}.s{fill:#12323b;font-size:12px}.n{font-size:12px;font-weight:800}</style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15b07e"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b7ea1"/></marker>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6670"/></marker>
  </defs>
  <!-- lanes -->
  <g text-anchor="middle">
    <rect x="70" y="20" width="120" height="34" rx="10" fill="#fff" stroke="#cfd8dd" stroke-width="1.5"/><text class="t" x="130" y="42">Player</text>
    <rect x="310" y="20" width="120" height="34" rx="10" fill="#e8f0f6" stroke="#3b7ea1" stroke-width="1.5"/><text class="t" x="370" y="42" fill="#295a74">DHT</text>
    <rect x="500" y="20" width="120" height="34" rx="10" fill="#e7f7f0" stroke="#0a7d5a" stroke-width="1.5"/><text class="t" x="560" y="42" fill="#0a7d5a">Mini-node</text>
    <rect x="660" y="20" width="120" height="34" rx="10" fill="#e8f0f6" stroke="#3b7ea1" stroke-width="1.5"/><text class="t" x="720" y="42" fill="#295a74">Full node</text>
  </g>
  <g stroke="#cfd8dd" stroke-width="1.2" stroke-dasharray="3 4">
    <line x1="130" y1="58" x2="130" y2="440"/><line x1="370" y1="58" x2="370" y2="440"/><line x1="560" y1="58" x2="560" y2="440"/><line x1="720" y1="58" x2="720" y2="440"/>
  </g>
  <g>
    <circle cx="130" cy="90" r="11" fill="#fff" stroke="#15b07e" stroke-width="1.6"/><text class="n" x="130" y="95" text-anchor="middle" fill="#0a7d5a">1</text>
    <text class="s" x="150" y="94">join the DHT under dht_bootstrap_hash</text>
    <path d="M135,114 L365,114" stroke="#3b7ea1" stroke-width="1.6" marker-end="url(#ab)"/>

    <circle cx="370" cy="146" r="11" fill="#fff" stroke="#15b07e" stroke-width="1.6"/><text class="n" x="370" y="151" text-anchor="middle" fill="#0a7d5a">2</text>
    <text class="s" x="390" y="150">find peers seeding the rendezvous key</text>
    <path d="M365,168 L135,168" stroke="#3b7ea1" stroke-width="1.6" marker-end="url(#ab)"/>
    <text class="s" x="250" y="184" fill="#3b7ea1" font-weight="600">peer set</text>

    <circle cx="130" cy="212" r="11" fill="#fff" stroke="#15b07e" stroke-width="1.6"/><text class="n" x="130" y="217" text-anchor="middle" fill="#0a7d5a">3</text>
    <text class="s" x="150" y="216">routes.get → pick a load-aware relay</text>
    <path d="M135,236 L555,236" stroke="#5b6670" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>

    <circle cx="560" cy="268" r="11" fill="#fff" stroke="#15b07e" stroke-width="1.6"/><text class="n" x="560" y="273" text-anchor="middle" fill="#0a7d5a">4</text>
    <text class="s" x="580" y="272">mini.hello (wallet) · presence.hello (signed)</text>
    <path d="M135,292 L555,292" stroke="#15b07e" stroke-width="1.8" marker-end="url(#ag)"/>
    <text class="s" x="330" y="308" fill="#0a7d5a" font-weight="600">bind wallet ⇄ peer id</text>

    <circle cx="560" cy="336" r="11" fill="#fff" stroke="#15b07e" stroke-width="1.6"/><text class="n" x="560" y="341" text-anchor="middle" fill="#0a7d5a">5</text>
    <text class="s" x="580" y="340">relay.forward wraps every RPC onward</text>
    <path d="M565,360 L715,360" stroke="#5b6670" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>

    <circle cx="720" cy="392" r="11" fill="#fff" stroke="#15b07e" stroke-width="1.6"/><text class="n" x="720" y="397" text-anchor="middle" fill="#0a7d5a">6</text>
    <text class="s" x="720" y="416" text-anchor="middle">songs.list / collections.list …</text>
    <path d="M715,434 L135,434" stroke="#15b07e" stroke-width="1.8" marker-end="url(#ag)"/>
    <text class="s" x="420" y="452" text-anchor="middle" fill="#0a7d5a" font-weight="600">catalog + rewards flow</text>
  </g>
</svg>
