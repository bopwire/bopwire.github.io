<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <style>.t{font-size:13px;font-weight:700}.s{fill:#5b6670;font-size:12px}.m{font-size:12px;font-weight:600}</style>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b7ea1"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15b07e"/></marker>
  </defs>
  <g text-anchor="middle">
    <rect x="60" y="20" width="180" height="34" rx="10" fill="#e8f0f6" stroke="#3b7ea1" stroke-width="1.5"/><text class="t" x="150" y="42" fill="#295a74">Catching-up node</text>
    <rect x="540" y="20" width="180" height="34" rx="10" fill="#e8f0f6" stroke="#3b7ea1" stroke-width="1.5"/><text class="t" x="630" y="42" fill="#295a74">Synced peer</text>
  </g>
  <line x1="150" y1="58" x2="150" y2="384" stroke="#cfd8dd" stroke-dasharray="3 4"/>
  <line x1="630" y1="58" x2="630" y2="384" stroke="#cfd8dd" stroke-dasharray="3 4"/>

  <g text-anchor="middle">
    <path d="M150,90 L630,90" stroke="#3b7ea1" stroke-width="1.6" marker-end="url(#ab)"/><text class="m" x="390" y="84" fill="#3b7ea1">block.hello — my tip is H</text>
    <path d="M630,140 L150,140" stroke="#3b7ea1" stroke-width="1.6" marker-end="url(#ab)"/><text class="m" x="390" y="134" fill="#3b7ea1">block.hello — my tip is H+N</text>
    <path d="M150,190 L630,190" stroke="#15b07e" stroke-width="1.6" marker-end="url(#ag)"/><text class="m" x="390" y="184" fill="#0a7d5a">block.getblocks (locator)</text>
    <path d="M630,240 L150,240" stroke="#15b07e" stroke-width="1.6" marker-end="url(#ag)"/><text class="m" x="390" y="234" fill="#0a7d5a">block.inv — hashes I have</text>
    <path d="M150,290 L630,290" stroke="#15b07e" stroke-width="1.6" marker-end="url(#ag)"/><text class="m" x="390" y="284" fill="#0a7d5a">block.getdata (wanted hashes)</text>
    <path d="M630,340 L150,340" stroke="#15b07e" stroke-width="1.6" marker-end="url(#ag)"/><text class="m" x="390" y="334" fill="#0a7d5a">block.data — full blocks</text>
  </g>
  <text class="s" x="390" y="404" text-anchor="middle">new locally-mined blocks are pushed the same way via an unsolicited block.inv</text>
</svg>
